# Runs every test on each push and pull request to main:
#  - web: the React editor and the Express server (vitest), the type check, and the production build of the editor,
#    which also runs scripts/check-bundle.mjs (the bundle's secret check).
#  - desktop: the Windows companion's xunit tests (.NET 10, WPF).
# Both jobs run on Windows: the companion only builds there, and the packaging tests use Windows paths.
# No secrets are needed: there is no .env in a checkout, so no NVIDIA key is ever loaded.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web editor + server
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Build the web editor
        run: npm run build

  desktop:
    name: Desktop companion
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Unit tests (xunit)
        run: dotnet test desktop/tests
